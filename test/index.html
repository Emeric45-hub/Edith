<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.D.I.T.H. — test</title>
<style>
  :root { color-scheme: light dark; --fond:#f6f4ef; --texte:#1f1d1a; --doux:#6b665e; --accent:#2e7df0; --carte:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fond:#141312; --texte:#ece8e1; --doux:#9a948a; --carte:#1f1d1b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--fond); color:var(--texte); font:17px/1.5 -apple-system, system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .carte { background:var(--carte); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:14px; color:var(--doux); margin-top:8px; }
  input { width:100%; font:inherit; padding:10px; border-radius:10px; border:1px solid #8884; background:transparent; color:inherit; }
  button { margin-top:12px; width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  #mesures { font-size:15px; color:var(--doux); white-space:pre-line; }
  #histoire { white-space:pre-wrap; }
</style>
</head>
<body>
<h1>E.D.I.T.H. — test de vitesse</h1>

<div class="carte" id="connexion">
  <label>E-mail du compte famille</label>
  <input id="email" type="email" autocomplete="username">
  <label>Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password">
  <button id="btnConnexion">Se connecter</button>
</div>

<div class="carte" id="demande" hidden>
  <label>Héros</label>
  <input id="heros" value="les 7 ours">
  <label>Thème</label>
  <input id="theme" value="les dinosaures">
  <label>Effort de réflexion</label>
  <select id="effort" style="width:100%;font:inherit;padding:10px;border-radius:10px;background:transparent;color:inherit">
    <option value="low">Bas (plus rapide)</option>
    <option value="medium" selected>Moyen</option>
    <option value="high">Élevé (plus lent)</option>
  </select>
  <button id="btnRaconte">Raconte !</button>
</div>

<div class="carte"><div id="mesures">Pas encore lancé.</div></div>
<div class="carte"><div id="histoire"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyC7sZDCVP-r34T33L6nEwWzibsrXnxletA",
    authDomain: "diversif-bebe.firebaseapp.com",
    projectId: "diversif-bebe",
  });
  const URL_FONCTION = "https://europe-west1-diversif-bebe.cloudfunctions.net/raconte";
  const $ = (id) => document.getElementById(id);

  firebase.auth().onAuthStateChanged((u) => {
    $('connexion').hidden = !!u;
    $('demande').hidden = !u;
  });

  $('btnConnexion').onclick = async () => {
    try {
      await firebase.auth().signInWithEmailAndPassword($('email').value.trim(), $('mdp').value);
    } catch (e) { $('mesures').textContent = 'Connexion impossible : ' + e.code; }
  };

  $('btnRaconte').onclick = async () => {
    const btn = $('btnRaconte');
    btn.disabled = true;
    $('histoire').textContent = '';
    const t0 = performance.now();
    let tPremier = 0, nb = 0;
    const affiche = (fin) => {
      const s = (ms) => (ms / 1000).toFixed(1) + ' s';
      $('mesures').textContent =
        'Premiers mots : ' + (tPremier ? s(tPremier) : '…') +
        '\nDurée totale : ' + (fin ? s(performance.now() - t0) : '…') +
        '\nCaractères : ' + nb;
    };
    affiche(false);
    try {
      const jeton = await firebase.auth().currentUser.getIdToken();
      const rep = await fetch(URL_FONCTION, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + jeton, 'Content-Type': 'application/json' },
        body: JSON.stringify({ heros: $('heros').value, theme: $('theme').value, effort: $('effort').value }),
      });
      if (!rep.ok) throw new Error('Réponse ' + rep.status + ' : ' + (await rep.text()));
      const lecteur = rep.body.getReader();
      const dec = new TextDecoder();
      for (;;) {
        const { value, done } = await lecteur.read();
        if (done) break;
        const morceau = dec.decode(value, { stream: true });
        if (morceau && !morceau.startsWith('\n\n[[DIAG]]') && !tPremier) tPremier = performance.now() - t0;
        nb += morceau.length;
        $('histoire').textContent += morceau;
        affiche(false);
      }
      affiche(true);
      // Diagnostic envoyé par la fonction à la fin du texte
      const tout = $('histoire').textContent;
      const i = tout.indexOf('[[DIAG]]');
      if (i >= 0) {
        $('histoire').textContent = tout.slice(0, i).trim();
        try {
          const d = JSON.parse(tout.slice(i + 8));
          const s = (ms) => ms ? (ms / 1000).toFixed(1) + ' s' : '—';
          $('mesures').textContent +=
            '\n\nEffort : ' + d.effort +
            '\nDébut de réflexion (serveur) : ' + s(d.reflexionDebutMs) +
            '\nPremiers mots (serveur) : ' + s(d.premiersMotsMs) +
            '\nJetons produits : ' + d.jetonsSortie +
            '\nFin : ' + (d.finRaison || '—') + (d.erreur ? ' · erreur ' + d.erreur : '');
        } catch (e) {}
      }
    } catch (e) {
      $('mesures').textContent = 'Erreur : ' + e.message;
    } finally {
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
